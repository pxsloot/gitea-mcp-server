name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  build:
    runs-on: self-hosted
    steps:
      - name: Check out repository code
        run: |
          git clone ${{ github.server_url }}/${{ github.repository }} work
          cd work
          git switch ${FORGEJO_HEAD_REF:-main}
      - name: build app image
        run: |
          cd work
          make docker-build-ci

  lint:
    needs: [build]
    runs-on: self-hosted
    container:
      image: gitea-mcp-server:ci
    steps:
      - name: Lint (ruff)
        run: |
          cd /app
          ruff check gitea_mcp_server

  lint-tests:
    needs: [build]
    runs-on: self-hosted
    container:
      image: gitea-mcp-server:ci
    steps:
      - name: Lint tests (ruff)
        run: |
          cd /app
          ruff check tests/

  typecheck:
    needs: [build]
    runs-on: self-hosted
    container:
      image: gitea-mcp-server:ci
    steps:
      - name: Type check (mypy)
        run: |
          cd /app
          mypy gitea_mcp_server

  typecheck-tests:
    needs: [build]
    runs-on: self-hosted
    container:
      image: gitea-mcp-server:ci
    steps:
      - name: Type check tests (mypy)
        run: |
          cd /app
          mypy tests

  test:
    needs: [build]
    runs-on: self-hosted
    container:
      image: gitea-mcp-server:ci
    steps:
      - name: Test with coverage
        run: |
          cd /app
          pytest -rs --cov=gitea_mcp_server --cov-report=xml --cov-report=term-missing

  # ── Live integration tests against a throwaway Forgejo instance ────
  #
  # Requires a running Docker daemon.  The Forgejo service container is
  # provisioned with a one-shot admin user and token.  The MCP server
  # binary runs inside the CI image over stdio, exercising the full
  # production path: spec fetch, scope filtering, tool calls, resource
  # reads — everything unit/integration tests cannot reach.
  #
  # Worker/run namespace and OwnershipLedger cleanup keep repeated CI
  # runs isolated.  This job is allowed to fail — external service
  # startup is inherently flaky and not a merge gate.
  live-test:
    needs: [build]
    runs-on: self-hosted
    continue-on-error: true
    services:
      forgejo:
        image: codeberg.org/forgejo/forgejo:16
        env:
          FORGEJO__security__INSTALL_LOCK: "true"
          FORGEJO__security__SECRET_KEY: "ci-live-test-key-change-me"
          FORGEJO__server__HTTP_PORT: "3000"
          FORGEJO__server__ROOT_URL: "http://localhost:3000"
          FORGEJO__database__DB_TYPE: "sqlite3"
          FORGEJO__repository__ENABLE_PUSH_CREATE_USER: "true"
    steps:
      - name: Wait for Forgejo and provision admin token
        run: |
          set -eu
          FORGEJO_CID="${{ job.services.forgejo.id }}"
          echo "Forgejo container: $FORGEJO_CID"
          # Wait for Forgejo health check (via docker exec — host
          # steps do not share the service container's network)
          for i in $(seq 1 30); do
            if docker exec "$FORGEJO_CID" curl -sLf http://localhost:3000 > /dev/null 2>&1; then
              echo "Forgejo ready after $i attempts"
              break
            fi
            echo "Waiting for Forgejo... ($i/30)"
            sleep 3
          done
          # Create one-shot admin user with access token
          RAW=$(docker exec "$FORGEJO_CID" gitea admin user create \
            --username ci-admin --password ci-admin-pass \
            --email admin@ci.local --admin --access-token 2>&1)
          echo "$RAW"
          TOKEN=$(echo "$RAW" | tail -1 | sed 's/.*Access token was successfully created: *//')
          if [ -z "$TOKEN" ]; then
            echo "ERROR: Failed to extract admin token"
            exit 1
          fi
          echo "ADMIN_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Run live tests
        env:
          GITEA_URL: "http://localhost:3000"
          GITEA_VERIFY_SSL: "false"
          GITEA_LIVE_RUN_ID: "ci-${{ github.run_number }}"
        run: |
          docker run --rm --network host \
            -e GITEA_URL="$GITEA_URL" \
            -e GITEA_TOKEN="$ADMIN_TOKEN" \
            -e GITEA_VERIFY_SSL="$GITEA_VERIFY_SSL" \
            -e GITEA_LIVE_RUN_ID="$GITEA_LIVE_RUN_ID" \
            gitea-mcp-server:ci \
            sh -c "cd /app && pytest tests/live/ -m live -v --timeout=300"
      - name: Collect Forgejo logs
        if: always()
        run: |
          FORGEJO_CID="${{ job.services.forgejo.id }}"
          if [ -n "$FORGEJO_CID" ]; then
            docker logs "$FORGEJO_CID" > forgejo-ci.log 2>&1 || true
            echo "Forgejo logs saved to forgejo-ci.log ($(wc -l < forgejo-ci.log) lines)"
          fi
